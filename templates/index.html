<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dubb CLI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background: #f5f5f4; color: #1c1917; }
    .toast-enter { animation: slideIn 0.3s ease forwards; }
    .toast-exit { animation: slideOut 0.3s ease forwards; }
    @keyframes slideIn { from { transform: translateY(-1rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-1rem); opacity: 0; } }
    .upload-zone { border: 2px dashed #d6d3d1; transition: all 0.2s; }
    .upload-zone.drag-over { border-color: #292524; background: #fafaf9; }
    .progress-ring { transition: stroke-dashoffset 0.3s; }
    .fade-in { animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="/ui/js/app.js"></script>
  <script type="text/babel" src="/ui/js/services/api.js"></script>
  <script type="text/babel" src="/ui/js/components/Toast.js"></script>
  <script type="text/babel" src="/ui/js/components/UploadZone.js"></script>
  <script type="text/babel" src="/ui/js/components/DubProgress.js"></script>
  <script type="text/babel" src="/ui/js/views/DubView.js"></script>
</body>
</html>
