[project]
name = "dubb-cli-v2"
version = "0.1.0"
description = "Local video dubbing with web UI"
requires-python = ">=3.10"

[project.scripts]
dubb-cli-v2 = "src.main:main"

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
